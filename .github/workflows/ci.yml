# Проверки кода на каждый коммит и пул-реквест: ruff, black, mypy --strict и pytest.
# Без видеокарты, базы и модели — зависимости из requirements-dev.txt (без docling и
# torch); проверки, которым они нужны, пропускаются сами. То же на своей машине:
# python kbrag.py lint и python kbrag.py test.
name: Проверки

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: ruff
        run: python -m ruff check kbrag kbrag.py tests
      - name: black
        run: python -m black --check kbrag kbrag.py tests
      - name: mypy — пакет
        run: python -m mypy -p kbrag
      - name: mypy — kbrag.py
        run: python -m mypy kbrag.py
      - name: pytest
        run: python -m pytest -rs
