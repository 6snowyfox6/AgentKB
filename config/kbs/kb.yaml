# НАСТРОЙКИ БАЗЫ ЗНАНИЙ — КОРЕНЬ ДЕРЕВА
#
# Дерево баз: у каждой базы своя папка здесь, по папке на шаг пути. База
# physics.optics — это config/kbs/physics/optics. В папке базы может быть:
#
#   kb.yaml             название, слова темы для промптов, сами промпты
#   synonyms.yaml       словарь синонимов
#   graph-rules.txt     правила для модели: как выписывать факты
#   eval-questions.yaml вопросы оценки (python kbrag.py eval)
#
# Чего у базы нет, берётся выше по дереву, до этого файла. kb.yaml складывается по
# ключам — у базы достаточно написать только то, что у неё своё; синонимы тоже
# складываются (у одного имени главнее ближний); правила графа и вопросы оценки —
# ближайший файл. Новую базу с заготовкой kb.yaml делает python kbrag.py kb create.
#
# Правится Блокнотом, сохранять в UTF-8. Действует сразу, перезапуск не нужен.

# С какой базой работать, если в команде нет --kb (и не задана переменная KBRAG_KB),
# например physics.optics. Пусто — всё дерево сразу: поиск и чат-бот по всем базам, а
# статьи import кладёт туда, куда сказано --kb.
база_по_умолчанию: ""

название: Все базы

# Слова темы — подставляются в промпты модели вместо {имени}. Падеж важен: он
# указан у каждого. Здесь — общие слова для базы о чём угодно; у базы со своей
# темой (например, config/kbs/geology/kb.yaml) они свои.
тема:
  # кого бот слушает, в родительном падеже: «помощник …», «вопрос …»
  пользователь: исследователя
  # предмет базы, в дательном падеже после «по»: «статьи по …», «специалист по …»
  область: теме этой базы знаний
  # на каком языке отвечать: «Пиши …»
  язык_ответа: по-русски
  # на каких языках составлять поисковые запросы (хотя бы по одному на каждом)
  языки_запросов: [по-русски, по-английски]
  # ещё языки статей базы, до которых русский и английский запрос не дотягивается
  # (китайский, японский): вопрос ищется и в переводе на них, а куски на этих языках
  # реранкер оценивает и по переводу. Пусто — без перевода. Пример — у линеаментов.
  языки_перевода: []
  # к чему относятся сведения статей, в дательном падеже: «относятся к конкретным …»
  объекты: объектам, условиям и источникам
  # как называть, к чему относится утверждение (примеры с номером фрагмента)
  пример_привязки: «в эксперименте при 300 К [3]», «для образца из второй серии [1]»
  # примеры составного вопроса
  пример_составного: признаки и методы; два объекта для сравнения; причина и следствие
  # что бывает «предметом» вопроса
  что_конкретное: объект, явление, метод, процесс, величина
  # примеры вопроса вдогонку и он же целиком
  пример_вдогонку: «а при нагреве?», «а как это измеряют?»
  пример_целиком: «Как измеряют вязкость этого раствора при нагреве?»
  # о чём вопрос «по теме»: «true, если вопрос …»
  по_теме: о предмете этой базы знаний или о методах его изучения
  # примеры вопросов не по теме
  не_по_теме: кулинария, спорт, бытовые советы
  # что бывает на рисунке
  виды_рисунков: график, диаграмма, схема, таблица, карта, фотография
  что_на_рисунке: объекты, величины, подписи, условные обозначения
  # для словаря синонимов: что не одно и то же
  пример_части_целого: «Западная Европа» и «Франция» — разное
  пример_похожих_разных: «протон» и «нейтрон» — разное; «вязкость» и «плотность» — разное
  # ответ на вопрос не по теме, когда в базе ничего нет
  отказ_не_по_теме: >-
    Вопрос не относится к теме этой базы знаний, а бот отвечает только по ней.
    В базе знаний статей об этом нет.

# Вопрос по теме, а в базе ответа не нашлось: true — модель отвечает из своих общих
# знаний (с пометкой «не из базы»), false — бот говорит, что в базе этого нет, и
# показывает, что искал. Такой ответ модели не проверен статьями и бывает неверным.
общие_знания: false

# Примеры вопросов под полем чата на странице (нажал — спросил). Пусто — без примеров;
# у базы со своей темой — свои (наследуются, как и всё здесь).
примеры_вопросов: []

# Промпты целиком. Пусто — шаблоны из кода (в них {слова темы} выше). Чтобы
# заменить шаблон, напишите его здесь под его именем: ответ, без_базы,
# разбор.система, разбор, отбор.система, отбор, рисунок, подтверждение.система,
# вопросы.система, вопросы, синонимы.система, синонимы, резюме_раздела,
# резюме_статьи. Подстановки шаблона из кода ({question}, {candidates}…) нужно
# сохранить; фигурные скобки JSON — двойные: {{ }}.
промпты: {}
