# НАСТРОЙКИ ВЕТКИ geology — рудная геология и прогноз оруденения.
#
# Действует на все базы под этой веткой; чего здесь нет, берётся из
# config/kbs/kb.yaml (там же — что значит каждое слово темы и в каком оно падеже).

название: Геология

тема:
  пользователь: геолога
  область: рудной геологии и прогнозу оруденения
  объекты: районам, месторождениям и объектам
  пример_привязки: «на Кокпатасском рудном поле [3]», «в Восточном Донбассе [1]»
  пример_составного: признаки и методы; две территории для сравнения; причина и следствие
  что_конкретное: место, разлом, метод, процесс, признак
  пример_вдогонку: «а по космоснимкам?», «а какие там породы?»
  пример_целиком: «Что известно о Персияновском разломе по космоснимкам?»
  по_теме: >-
    о геологии, полезных ископаемых, геофизике, геохимии, дистанционном
    зондировании Земли или методах их изучения
  не_по_теме: кулинария, спорт, программирование
  виды_рисунков: карта, разрез, график, диаграмма, схема, фотография
  что_на_рисунке: район, объекты, породы, разломы, месторождения, скважины
  пример_части_целого: «Eastern Donbass» и «Donetsk basin» — разное
  пример_похожих_разных: >-
    «Leimengou intrusion» и «Leimengou ore district» — разное; «окварцевание» и
    «серицитизация» — разное
  отказ_не_по_теме: >-
    Вопрос не относится к геологии, а бот отвечает только по рудной геологии и
    смежным наукам о Земле. В базе знаний статей об этом нет.

# Примеры вопросов под полем чата на странице (нажал — спросил).
примеры_вопросов:
  - Как выделяют рудные узлы по плотности линеаментов?
  - Какие гидротермальные изменения видны на снимках ASTER?
  - Что известно о золотоносности Анабарского щита?
  - Какие методы используют для прогноза оруденения?
