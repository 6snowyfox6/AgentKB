# НАСТРОЙКИ БАЗЫ geology.lineaments — линеаменты и их выделение.
#
# Остальные слова темы, синонимы и правила графа — от ветки geology (config/kbs/geology).
# Подбазы — по категориям исходной подборки: manual (ручное выделение), computer
# (компьютерное), remote_sensing (по ДЗЗ, метод не указан).
# Правится Блокнотом, сохранять в UTF-8; действует сразу.

название: Линеаменты

тема:
  область: линеаментам, разломам и их выделению по ДЗЗ, ЦМР и геофизике
  # Пример — без названий мест: модель брала район из примера в свой ответ
  # (стресс-тест 20.10.2026: «Тяньшань» приписан статье про Зимбабве).
  пример_привязки: «на снимках Landsat 8 [3]», «по ЦМР SRTM с разрешением 30 м [1]»
  пример_составного: ручное и автоматическое выделение; два района для сравнения; метод и точность
  что_конкретное: место, разлом, линеамент, метод, снимок, фильтр
  пример_вдогонку: «а по радарным данным?», «а как проверяли в поле?»
  пример_целиком: «Как выделяют линеаменты по радарным снимкам Sentinel-1?»
  # В базе около 40 статей с текстом на китайском и 25 на японском: русский и английский
  # запрос их не находит, поэтому вопрос ищется ещё и в переводе на эти языки.
  языки_перевода: [по-китайски, по-японски]
  отказ_не_по_теме: >-
    Вопрос не относится к теме базы: бот отвечает только о линеаментах, разломах
    и их выделении по снимкам, ЦМР и геофизике. В базе знаний статей об этом нет.

примеры_вопросов:
  - Какие методы автоматического выделения линеаментов используют?
  - Как плотность линеаментов связана с оруденением?
  - Какие фильтры применяют к снимкам для выделения разломов?
  - Чем ручное выделение линеаментов отличается от компьютерного?
